name: Quality checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:contracts
      - run: npm run check:client-contracts
      - run: npm ci --prefix client
      - run: npm run typecheck --prefix client
      - run: npm run lint --prefix client
      - run: npm test
      - run: npm run build
      - run: npm run test:foundation
