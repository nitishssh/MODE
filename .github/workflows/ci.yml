name: Quality checks

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run check:all
        env:
          CI: "1"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every helper-backed test resets the public schema. This database belongs
    # only to this job; never replace this URL with a deployment secret.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mode_test
          POSTGRES_PASSWORD: mode_ci_only
          POSTGRES_DB: mode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mode_test -d mode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:postgres
        env:
          CI: "1"
          DATABASE_URL: ""
          MODE_TEST_DATABASE_URL: postgres://mode_test:mode_ci_only@127.0.0.1:5432/mode_test

  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Server production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      # Known transitive Expo 57 advisories; resolved by the deferred Expo 58 upgrade
      # (branch claude/expo-dependency-vulnerabilities-ba4bad). Reported, not blocking.
      - name: Expo client production dependencies (report only)
        continue-on-error: true
        run: npm --prefix client audit --package-lock-only --omit=dev --audit-level=high
